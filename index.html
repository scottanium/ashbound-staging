<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#140f0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Ashbound is a single-player action RPG about the last Cinder Warden.">
  <title>Ashbound</title>
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
:root {
  --bg: #140f0c;
  --bg-2: #241910;
  --panel: #1a1410;
  --line: #8d6840;
  --line-dim: #4a382b;
  --text: #f4ecdf;
  --muted: #b6a48f;
  --ember: #e36a2d;
  --ember-2: #ffb067;
  --life: #d4533a;
  --mana: #3f78d0;
  --xp: #e0b15a;
  /* rarity colors come from data/rarity.json via abRarityCss() */
  --ok: #9ddea0;
  --bad: #ff8d7a;
  --serif: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
  --sans: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --cell: 32px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
button, input, textarea { font: inherit; color: inherit; }
input, textarea { user-select: text; -webkit-user-select: text; touch-action: auto; }
button { cursor: pointer; }
#app { position: fixed; inset: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: absolute; inset: 0; pointer-events: none; }
.pe, .screen, #panel, #rotate-overlay, #veil, #say, #say * { pointer-events: auto; }
#hud, #hud * { pointer-events: none; }
#joystick, #joystick *, #belt-left, #belt-left *, #belt-right, #belt-right *,
#cast, #cast *, #dock, #dock *, #interact, #btn-attack, .skill-btn, .flask,
#quest-track, #point-hint, #point-hint *, #tutor, #tutor * { pointer-events: auto; }
.hidden { display: none !important; }

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  background: linear-gradient(to right, rgba(8, 5, 4, 0.78), rgba(8, 5, 4, 0.2) 42%, rgba(8, 5, 4, 0.72));
  gap: 14px;
}
.screen-copy, .screen-slots, .screen-form { min-width: 0; }
.brand { margin-top: auto; }
.eyebrow {
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ember-2);
  font-size: 12px;
  margin: 0 0 6px;
}
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; }
h1 { font-size: 64px; letter-spacing: 0.02em; line-height: 0.9; }
.wordmark {
  font-size: 58px;
  letter-spacing: 0.22em;
  line-height: 1;
  text-indent: 0.22em;
}
.title-main { display: flex; align-items: center; justify-content: space-between; gap: 24px; width: min(920px, 100%); }
.title-actions { display: flex; flex-direction: column; gap: 8px; width: min(280px, 40vw); }
.title-actions .btn { width: 100%; }
.pick { display: flex; gap: 8px; align-items: stretch; min-width: 0; flex: 1.4; }
.hero-pick {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  text-align: center;
  padding: 8px 4px;
  background: rgba(22, 16, 12, 0.78);
  border: 1px solid var(--line-dim);
  border-radius: 14px;
  color: inherit;
}
.hero-pick.is-sel { border-color: var(--ember-2); box-shadow: inset 0 0 0 1px var(--ember-2); }
.hero-pick strong { font-family: var(--serif); font-size: 14px; }
.hero-pick .role { color: var(--ember-2); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.hero-pick .pitch { font-size: 11px; line-height: 1.25; color: var(--muted); }
.hero-pick .stars { color: var(--xp); letter-spacing: 0.08em; font-size: 12px; }
.class-hero { width: 96px; height: 96px; image-rendering: pixelated; }
#hud-goal {
  grid-column: 1 / -1;
  color: var(--ember-2);
  font-size: 12px;
  line-height: 1.25;
  white-space: normal;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  background: none;
  border: 0;
  padding: 0;
  text-align: left;
  min-height: 0;
  width: 100%;
}
.learn-mark { font-size: 18px; color: var(--muted); }
.tag { margin: 8px 0 0; color: var(--muted); font-family: var(--serif); font-size: 18px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.slot-card, .class-card, .panel, .detail, .shop-row {
  background: rgba(28, 20, 16, 0.9);
  border: 1px solid var(--line-dim);
  border-radius: 14px;
}
.slot-card, .class-card { padding: 12px; }
button.class-card { display: block; width: 100%; text-align: left; margin: 0 0 8px; }
button.class-card.is-sel { border-color: var(--ember-2); box-shadow: inset 0 0 0 1px var(--ember-2); }
.slot-card strong, .class-card strong { font-family: var(--serif); font-size: 20px; }
.muted { color: var(--muted); }
.small { font-size: 13px; line-height: 1.4; }
.banner { color: var(--bad); min-height: 1.2em; }

.btn, button.btn {
  background: linear-gradient(#3a2a20, #2a1d16);
  border: 1px solid var(--line);
  border-radius: 12px;
  min-height: 44px;
  padding: 8px 14px;
  color: var(--text);
  font-family: var(--serif);
  letter-spacing: 0.03em;
}
.btn.primary {
  background: linear-gradient(#f0a05a, #c25420);
  color: #2a140c;
  border-color: #ffd0a4;
  font-weight: 700;
}
.btn:disabled { opacity: 0.45; }
.btn.slim { min-height: 36px; padding: 4px 10px; font-family: var(--sans); letter-spacing: 0; }
.grow { flex: 1; }

input[type="text"], textarea {
  width: 100%;
  background: #120e0b;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  font-size: 16px;
}
textarea { min-height: 88px; resize: vertical; }

#hud { position: absolute; inset: 0; }
#hud::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 88px;
  background: linear-gradient(to top, rgba(8, 6, 5, 0.82), rgba(8, 6, 5, 0.42) 58%, transparent);
  pointer-events: none;
  z-index: 1;
}
#hud::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 78px;
  background: linear-gradient(to bottom, rgba(8, 6, 5, 0.78), rgba(8, 6, 5, 0.28) 70%, transparent);
  pointer-events: none;
  z-index: 1;
}
#topbar, #bossbar, #minimap, .orb, #joystick, .flask-col, #cast, #dock, #hint, #tutor, #interact, #toasts {
  z-index: 2;
}
#topbar {
  position: absolute;
  top: calc(6px + env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  width: min(380px, 46vw);
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 1px 10px;
  text-shadow: 0 1px 2px #000;
  text-align: left;
  padding: 4px 12px 10px;
  border-radius: 14px;
  background: #160f0c;
  border: 1px solid rgba(141, 104, 64, 0.7);
  z-index: 4;
}
.who { font-family: var(--serif); font-size: 15px; }
#hud-gold { color: var(--xp); text-align: right; }
#hud-zone { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.bar.xp {
  grid-column: 1 / -1;
  position: relative;
  height: 5px;
  border-radius: 999px;
  background: #1a120e;
  border: 1px solid rgba(255, 220, 180, 0.18);
  overflow: hidden;
}
.bar.xp span { display: block; height: 100%; width: 0; background: var(--xp); }
.orb {
  position: absolute;
  width: 68px;
  height: 68px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
  --pct: 100;
}
.orb em {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #3a241c, #120c0a 70%);
  display: grid;
  place-items: center;
  font-style: normal;
  font-size: 12px;
  font-family: var(--serif);
}
.orb.life {
  left: calc(18px + env(safe-area-inset-left));
  bottom: calc(122px + env(safe-area-inset-bottom));
  background: conic-gradient(#e36a4a calc(var(--pct) * 1%), #3a1814 0);
  border: 2px solid #8a4034;
}
.orb.mana {
  right: calc(18px + env(safe-area-inset-right));
  bottom: calc(122px + env(safe-area-inset-bottom));
  background: conic-gradient(#6ea0ef calc(var(--pct) * 1%), #142033 0);
  border: 2px solid #3d5c8a;
}
.stam-bar {
  position: absolute;
  left: calc(18px + env(safe-area-inset-left));
  bottom: calc(196px + env(safe-area-inset-bottom));
  width: 72px;
  height: 8px;
  border-radius: 99px;
  overflow: hidden;
  border: 1px solid #8a6a30;
  background: #24180c;
  box-shadow: 0 2px 8px rgba(0,0,0,0.45);
  z-index: 3;
  pointer-events: none;
  --pct: 100;
}
#overhead-bars { position:absolute; left:0; top:0; display:flex; flex-direction:column; gap:var(--gap,2px); pointer-events:none; z-index:3; width:44px; }
#overhead-bars.hidden { display:none !important; }
#overhead-bars i { display:block; height:var(--h,5px); background:#2a1c16; border:1px solid #140e0a; border-radius:2px; overflow:hidden; }
#overhead-bars i span { display:block; height:100%; width:0; }
#overhead-bars .oh-hp { background:linear-gradient(#e25a3a,#a82818); }
#overhead-bars .oh-mp { background:linear-gradient(#5aa0e0,#2a5aaa); }
#btn-mute { position:absolute; z-index:5; width:48px; height:48px; min-width:44px; min-height:44px; padding:0; border-radius:12px; border:1px solid var(--line); background:rgba(22,16,12,0.9); color:#f4ecdf; display:grid; place-items:center; pointer-events:auto; }
#btn-mute .ic-off { display:none; }
#btn-mute.is-muted .ic-on { display:none; }
#btn-mute.is-muted .ic-off { display:block; }
#btn-mute.is-muted { color:#e8a070; box-shadow:0 0 0 1px rgba(232,160,112,0.45); }


.stam-bar span {
  display: block;
  height: 100%;
  width: calc(var(--pct) * 1%);
  background: linear-gradient(90deg, #c9842a, #f0d56a);
}
.stam-bar.is-lock span { background: linear-gradient(90deg, #8a5a22, #c9a24a); }
body.left-hand .stam-bar {
  left: auto;
  right: calc(18px + env(safe-area-inset-right));
}
#minimap {
  position: absolute;
  top: calc(8px + env(safe-area-inset-top));
  right: calc(8px + env(safe-area-inset-right));
  width: 92px;
  height: 72px;
  border-radius: 10px;
  border: 1px solid var(--line-dim);
  background: #120e0b;
  z-index: 4;
}
body.boss-up #hud-zone,
body.boss-up .bar.xp { visibility: hidden; }
#bossbar {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: calc(78px + env(safe-area-inset-top));
  width: min(300px, 36vw);
  background: rgba(16, 10, 8, 0.8);
  border: 1px solid #8a3a22;
  border-radius: 10px;
  padding: 6px 8px;
}
#bossbar .track { height: 8px; background: #2a1612; border-radius: 99px; overflow: hidden; }
#bossbar .track span { display: block; height: 100%; background: #ff5a1f; width: 0; }
#boss-name { font-family: var(--serif); font-size: 13px; color: #ffb067; }
#toasts {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: calc(96px + env(safe-area-inset-top));
  width: min(360px, 42vw);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.toast {
  background: rgba(20, 14, 10, 0.88);
  border: 1px solid var(--line-dim);
  border-radius: 10px;
  padding: 4px 8px;
  text-align: left;
  font-size: 12px;
}
.toast.good { color: var(--ok); }
.toast.bad { color: var(--bad); }
#hint {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: calc(78px + env(safe-area-inset-top));
  bottom: auto;
  max-width: min(360px, 70vw);
  text-align: center;
  color: var(--ember-2);
  font-size: 13px;
  text-shadow: 0 1px 2px #000;
  pointer-events: none;
  transition: opacity 0.7s ease;
}
#hint:empty { opacity: 0; }
#tutor {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: calc(112px + env(safe-area-inset-top));
  bottom: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: min(420px, 62vw);
  padding: 6px 8px 6px 12px;
  border-radius: 999px;
  background: rgba(18, 12, 8, 0.82);
  color: var(--ember-2);
  font-size: 13px;
  pointer-events: auto;
  z-index: 4;
}
#tutor.hidden { display: none; }
#cast.ab-arc #skillbar { position: absolute; inset: 0; display: block; width: auto; height: auto; }
#cast.ab-arc .skill-btn { position: absolute; border-radius: 50%; margin: 0; }
#cast.ab-arc .skill-btn .key { left: 50%; top: -1px; transform: translateX(-50%); }
#cast.ab-arc { gap: 0; }

#quest-track.is-guide { border-color: rgba(255,190,110,.85); box-shadow: 0 0 0 1px rgba(255,170,80,.35), 0 0 14px rgba(255,150,60,.35); }
#quest-track.is-guide #quest-kicker { color: #ffcf8a; }
#quest-track #hud-goal { font-weight: 600; }
.ab-guide { animation: abGuidePulse 1.3s ease-in-out infinite; position: relative; }
@keyframes abGuidePulse { 0%,100% { box-shadow: 0 0 0 2px rgba(255,190,100,.55), 0 0 8px rgba(255,150,60,.35); } 50% { box-shadow: 0 0 0 3px rgba(255,214,140,.95), 0 0 20px rgba(255,150,60,.75); } }

#tutor p { margin: 0; }
#tutor-skip { min-height: 28px; padding: 2px 10px; }
.slider { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
.slider input { width: 140px; }
.skill-ico, .flask svg { width: 22px; height: 22px; display: block; margin: 0 auto; }
.empty-slot { display: block; width: 16px; height: 16px; margin: 4px auto 0; border: 1px solid rgba(240, 214, 170, 0.25); border-radius: 4px; }
#interact {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(52px + env(safe-area-inset-bottom));
  max-width: min(220px, 40vw);
  min-height: 32px;
  padding: 4px 10px;
  font-size: 12px;
  z-index: 3;
}
#channel {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(86px + env(safe-area-inset-bottom));
  width: min(280px, 32vw);
  height: 8px;
  background: #2a211c;
  border-radius: 99px;
  overflow: hidden;
}
#channel span { display: block; height: 100%; background: var(--ember); }
#joystick {
  position: absolute;
  left: calc(10px + env(safe-area-inset-left));
  bottom: calc(8px + env(safe-area-inset-bottom));
  width: 108px;
  height: 108px;
  border-radius: 50%;
  background: rgba(20, 14, 10, 0.45);
  border: 2px solid rgba(227, 154, 69, 0.55);
  touch-action: none;
}
#stick {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #f0c090, #a85a30);
  position: absolute;
  left: 29px;
  top: 29px;
}
.flask-col { position: absolute; display: flex; flex-direction: column; gap: 6px; }
#belt-left {
  left: calc(126px + env(safe-area-inset-left));
  bottom: calc(14px + env(safe-area-inset-bottom));
}
#belt-right {
  right: calc(208px + env(safe-area-inset-right));
  bottom: calc(14px + env(safe-area-inset-bottom));
}
.flask {
  width: 46px;
  height: 44px;
  border-radius: 12px;
  border: 1px solid var(--line-dim);
  background: rgba(20, 14, 10, 0.78);
  font-size: 11px;
  display: grid;
  place-items: center;
}
.flask .item-ico { width: 18px; height: 26px; }
.flask.life { box-shadow: inset 0 -8px 0 rgba(142, 44, 34, 0.55); }
.flask.mana { box-shadow: inset 0 -8px 0 rgba(36, 78, 150, 0.55); }
.flask.hidden { display: none; }
.portal-btn {
  width: 46px;
  height: 44px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(28, 18, 14, 0.9);
  display: grid;
  place-items: center;
  padding: 0;
}
#mod-note {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(146px + env(safe-area-inset-bottom));
  max-width: min(480px, 62vw);
  text-align: center;
  color: #ffd7a8;
  font-size: 13px;
  pointer-events: none;
  text-shadow: 0 1px 2px #000;
}
#mod-note:empty { display: none; }
#cast {
  position: absolute;
  right: calc(8px + env(safe-area-inset-right));
  bottom: calc(8px + env(safe-area-inset-bottom));
  display: flex;
  gap: 8px;
  align-items: end;
}
#skillbar { display: grid; grid-template-columns: 50px 50px; gap: 6px; }
.skill-btn, #btn-attack {
  position: relative;
  overflow: hidden;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(28, 18, 14, 0.82);
  color: var(--text);
}
.skill-btn { width: 50px; height: 50px; font-size: 11px; line-height: 1.1; }
.skill-btn .sweep {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 0;
  background: rgba(0, 0, 0, 0.55);
  pointer-events: none;
}
.skill-btn .key, #btn-attack .key {
  position: absolute;
  left: 4px;
  top: 2px;
  font-size: 10px;
  color: var(--muted);
}
#btn-attack {
  width: 74px;
  height: 74px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #f0a05a, #a8431c);
  color: #2a140c;
  font-family: var(--serif);
  font-weight: 700;
}
#dock {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(8px + env(safe-area-inset-bottom));
  display: flex;
  gap: 6px;
}
#dock button {
  min-height: 36px;
  min-width: 0;
  padding: 0 12px;
  border-radius: 12px;
  border: 1px solid var(--line-dim);
  background: rgba(22, 16, 12, 0.88);
  font-family: var(--serif);
  font-size: 14px;
}
body.panel-open #joystick,
body.panel-open #cast,
body.panel-open #belt-left,
body.panel-open #belt-right,
body.panel-open #dock,
body.panel-open #life-orb,
body.panel-open #mana-orb,
body.panel-open #stam-bar,
body.panel-open #interact,
body.panel-open #hint,
body.panel-open #tutor,
body.panel-open #mod-note,
body.panel-open #quest-track,
body.panel-open #obj-arrow,
body.panel-open #point-hint { visibility: hidden; }
body.has-banner #hint,
body.has-banner #tutor { visibility: hidden; }

#rotate-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 22px;
  padding: 24px;
  background: #140f0c;
  pointer-events: auto;
  touch-action: none;
  user-select: none;
}
body.portrait-phone #rotate-overlay { display: flex; }
body.portrait-phone { overflow: hidden; }
.rotate-card {
  width: min(360px, 100%);
  text-align: center;
  background: none;
  border: none;
  padding: 0;
}
.rotate-card h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 700;
  color: #f4ecdf;
  letter-spacing: 0.02em;
}
.rotate-card p { color: var(--muted); }
.phone-turn {
  width: 46px;
  height: 78px;
  margin: 0 auto 14px;
  border: 3px solid var(--ember-2);
  border-radius: 10px;
  position: relative;
  animation: turn-phone 1.8s ease-in-out infinite;
}
.phone-turn::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 7px;
  width: 14px;
  height: 3px;
  border-radius: 2px;
  background: var(--ember-2);
  transform: translateX(-50%);
}
@keyframes turn-phone {
  0%, 18% { transform: rotate(0deg); }
  55%, 100% { transform: rotate(-90deg); }
}
@media (prefers-reduced-motion: reduce) {
  .phone-turn { animation: none; transform: rotate(-90deg); }
  .plus.live { animation: none; outline: 1px solid var(--ember-2); }
}

  position: absolute;

  height: 42px;

  border-radius: 50%;

  content: "";

   through --inv-* vars (set in abInvApply). Scoped to the Gear > Sheet screen only. */
#panel:has(.gear-board) { --inv-slot: 58px; --inv-cell: 34px; --inv-cell-min: 28px; --inv-stat: 40px; --inv-gap: 4px; }
#panel .gear-board { --dollw: calc(3 * var(--inv-slot) + 2 * var(--inv-gap)); grid-template-columns: var(--dollw) minmax(0, 1fr); gap: 4px 12px; }

  grid-template-columns: repeat(3, var(--inv-slot));
  grid-template-rows: repeat(4, var(--inv-slot));
  gap: var(--inv-gap);
  width: var(--dollw);
}
#panel .doll-compact .ring1 { grid-area: 1 / 1; }
#panel .doll-compact .helm { grid-area: 1 / 2; }
#panel .doll-compact .amulet { grid-area: 1 / 3; }
#panel .doll-compact .weapon { grid-area: 2 / 1; }
#panel .doll-compact .doll-hero { grid-area: 2 / 2 / 4 / 3; }
#panel .doll-compact .offhand { grid-area: 2 / 3; }
#panel .doll-compact .gloves { grid-area: 3 / 1; }
#panel .doll-compact .boots { grid-area: 3 / 3; }
#panel .doll-compact .belt { grid-area: 4 / 1; }
#panel .doll-compact .armor { grid-area: 4 / 2; }
#panel .doll-compact .ring2 { grid-area: 4 / 3; }
#panel .doll-compact .doll-slot,
#panel .doll-compact button.doll-slot {
  width: var(--inv-slot);
  height: var(--inv-slot);
  min-height: var(--inv-slot) !important;
  padding: 3px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border-radius: 12px;
  box-sizing: border-box;
  overflow: hidden;
}
#panel .doll-compact .slot-ico { width: calc(var(--inv-slot) - 26px); height: calc(var(--inv-slot) - 26px); flex: none; display: flex; }
#panel .doll-compact .slot-ico.ghost { opacity: 0.4; }
#panel .doll-compact .slot-lab { font-size: 11px; line-height: 1.05; color: var(--muted); text-align: center; }
#panel .doll-compact .has-item .slot-lab { position: absolute; left: 1px; right: 1px; bottom: 1px; font-size: 10px; background: rgba(18, 12, 8, 0.72); }
#panel .doll-compact .doll-hero {
  width: 100%; height: 100%; min-height: 0; box-sizing: border-box; object-fit: contain; image-rendering: pixelated;
  padding: 0; border-radius: 12px; border: 1px solid var(--line-dim); overflow: hidden; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 45%, rgba(227, 106, 45, 0.16), rgba(18, 12, 8, 0.2) 70%);
}
#panel .doll-compact .doll-hero img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; transform: scale(1.45); transform-origin: 50% 55%; }
#panel .stat-row { margin: 0; gap: 6px; }
#panel .stat-row .stat { min-height: var(--inv-stat); background: #1a1410; border-radius: 10px; padding: 0 4px 0 8px; gap: 4px; align-items: center; }
#panel .stat-row .stat-name { min-height: var(--inv-stat); font-size: 14px; }
#panel .stat-row .stat-name span { overflow: visible; text-overflow: clip; }
#panel .stat-row .plus { width: max(36px, var(--inv-stat)); height: max(36px, var(--inv-stat)); flex: none; }
#panel .gear-bag { container-type: inline-size; min-width: 0; }
#panel .gear-bag .grid { --cell: min(var(--inv-cell), calc((100cqw - 4px) / var(--cols))); }
#panel .gear-bag .row .btn { min-height: 40px; }
.detail-x { display: none; }

/* phone landscape: name | doll left, pack and stats middle, tooltip right */
body[data-inv-profile="phoneLandscape"] #panel .gear-doll { display: contents; }
body[data-inv-profile="phoneLandscape"] #panel .gear-doll p.small { grid-column: 1; grid-row: 1; }
body[data-inv-profile="phoneLandscape"] #panel .doll-compact { grid-column: 1; grid-row: 2 / 4; }
body[data-inv-profile="phoneLandscape"] #panel .gear-bag { grid-column: 2; grid-row: 1 / 3; }
body[data-inv-profile="phoneLandscape"] #panel .stat-row { grid-column: 2; grid-row: 3; display: grid; grid-template-columns: repeat(4, 1fr); align-self: end; }
body[data-inv-profile="phoneLandscape"] #panel .stat-row .stat { min-width: 0; }
body[data-inv-profile="phoneLandscape"] #panel .stat-row .stat-name { padding: 0; font-size: 13px; }

body[data-inv-profile="phoneLandscape"] #panel:has(.gear-board) { grid-template-rows: auto 0 minmax(0, 1fr); }
body[data-inv-profile="phoneLandscape"] #panel:has(.gear-board) .tabs { grid-row: 1; grid-column: 1; justify-self: start; align-self: center; margin-left: 96px; }
body[data-inv-profile="phoneLandscape"] #panel .stat-row { gap: 4px; }
body[data-inv-profile="phoneLandscape"] #panel .stat-row .stat { padding: 0 0 0 6px; }
body[data-inv-profile="phoneLandscape"] #panel .stat-row .stat-name { font-size: 12px; gap: 3px; justify-content: flex-start; }
body[data-inv-profile="phoneLandscape"] #panel .stat-row { grid-template-columns: repeat(4, minmax(0, 1fr)); }
body[data-inv-profile="phoneLandscape"] #panel .stat-row .plus { width: var(--inv-stat); height: var(--inv-stat); }
/* Consume shares the existing stats row (not a 4th auto row) so the 390px sheet still fits. */
body[data-inv-profile="phoneLandscape"] #panel .gear-board {
  grid-template-rows: auto minmax(0, 1fr) 72px;
}
body[data-inv-profile="phoneLandscape"] #panel .consume-slot-wrap {
  grid-column: 2;
  grid-row: 3;
  align-self: start;
  justify-self: stretch;
  width: auto;
  max-width: 100%;
  margin: 0;
  z-index: 1;
}
body[data-inv-profile="phoneLandscape"] #panel .consume-slot {
  display: flex;
  grid-template-columns: none;
  grid-template-rows: none;
  min-height: 28px;
  max-height: 32px;
  padding: 2px 6px;
  column-gap: 6px;
  row-gap: 0;
}
body[data-inv-profile="phoneLandscape"] #panel .consume-slot .slot-lab {
  grid-column: auto;
  grid-row: auto;
  flex: 0 0 auto;
}
body[data-inv-profile="phoneLandscape"] #panel .consume-slot .slot-ico,
body[data-inv-profile="phoneLandscape"] #panel .consume-slot .consume-name,
body[data-inv-profile="phoneLandscape"] #panel .consume-slot .consume-lvl {
  grid-column: auto;
  grid-row: auto;
}

/* desktop: a wide inset sheet, taller figure, big pack cells, stats under the doll */
body[data-inv-profile="desktop"] #panel:has(.gear-board) {
  inset: 3vh auto; left: 50%; width: min(1720px, 95vw); grid-template-columns: minmax(0, 1fr) minmax(380px, 0.42fr);
}
body[data-inv-profile="desktop"] #panel .gear-board { gap: 12px 28px; padding: 6px 4px; }
body[data-inv-profile="desktop"] #panel .panel-head,
body[data-inv-profile="desktop"] #panel .tabs,
body[data-inv-profile="desktop"] #panel .stat-row,
body[data-inv-profile="desktop"] #panel .gear-doll p.small,
body[data-inv-profile="desktop"] #panel .gear-bag .row { zoom: 1.25; }
body[data-inv-profile="desktop"] #panel .detail { zoom: 1.3; }
body[data-inv-profile="desktop"] #panel .stat-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
body[data-inv-profile="desktop"] #panel .doll-compact .slot-lab { font-size: 12px; }
body[data-inv-profile="desktop"] #panel .doll-compact .has-item .slot-lab { font-size: 11px; }
body[data-inv-profile="desktop"] #panel .gear-bag .row .btn { min-height: 44px; }

#panel .item-set { margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line-dim); }
#panel .item-set-name { font-weight: 700; }
#panel .detail-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
#panel .detail-scroll-hint { display: none; flex: 0 0 auto; font-size: 11px; letter-spacing: .04em; color: var(--muted); text-align: center; padding: 2px 0 1px; }
#panel .detail-scroll-hint.on { display: block; }
#panel .detail-head { gap: 2px; }
#panel .detail-head .row { align-items: center; }

#panel .stats-set { margin: 0 0 8px; }
#panel .stats-set-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
#panel .stats-set-head .rar-set { font-weight: 700; }
#panel .stats-sets { min-width: 0; }
#panel .stats-sets .small { overflow-wrap: anywhere; }
</style>
